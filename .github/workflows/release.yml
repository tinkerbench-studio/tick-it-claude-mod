name: Release
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # A pull request never changes the plugin version: the release job below raises it after the merge
  # (.claude/skills/version-raise). This check fails a pull request that does, so a raise cannot clash with main.
  plugin-version:
    name: Plugin version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: tinkerbench-studio/github-actions/version-check@3b62017c96ef699ebedcd21924707f313a96e8f0 # v1.3.0
        with:
          copies: |
            .claude-plugin/plugin.json
            hooks/state.ts MOD_VERSION = '([^']+)'
            tests/contract-fixtures.json "modVersion": "([^"]+)"

  # Merged to main: when the merge changed hooks/, skills/, types/ or plugin.json, raise the version in plugin.json,
  # MOD_VERSION and modVersion (the shared version-raise action), commit that to main, tag that commit v<version> and cut a release.
  # The raise commit is skipped by this job itself, and a push made with GITHUB_TOKEN starts no workflow.
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # One raise at a time, each on the latest main, so no merge ships without its raise.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Skip the raise commit
        id: skip
        run: |
          if git log -1 --format=%s "$GITHUB_SHA" | grep -q '^Raise the plugin version to '; then
            echo "This is the raise commit."
            echo "raise=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Raise the version
        id: raise
        if: steps.skip.outputs.raise != 'false'
        uses: tinkerbench-studio/github-actions/version-raise@3b62017c96ef699ebedcd21924707f313a96e8f0 # v1.3.0
        with:
          copies: |
            .claude-plugin/plugin.json
            hooks/state.ts MOD_VERSION = '([^']+)'
            tests/contract-fixtures.json "modVersion": "([^"]+)"
          paths: |
            /hooks/**
            /skills/**
            /types/**
            /.claude-plugin/plugin.json
          before: ${{ github.event.before }}
      - name: Commit, tag v<version> and release it
        if: steps.raise.outputs.raised == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.raise.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Raise the plugin version to $VERSION"
          git push origin HEAD:main
          gh release create "v$VERSION" --target "$(git rev-parse HEAD)" --title "v$VERSION" --generate-notes
