name: Release
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # The merge queue's "Plugin version" check: a change to the plugin must end up with a version above main's, or installs never see it.
  # A pull request does not raise it; the queue's head does (.claude/skills/version-raise). Keep this job out of every `needs`:
  # the queue acts on a rule's check only when it is the only failure on the commit.
  plugin-version:
    name: Plugin version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node scripts/plugin-version.mjs
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

  # Merged to main with a version that has no tag yet: tag that commit and cut a release.
  tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag v<version> and release it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v$(node -p 'require("./.claude-plugin/plugin.json").version')
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists."
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
